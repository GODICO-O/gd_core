name: Build Rust Core (.so)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Setup Rust & Android Target
        run: |
          rustup target add aarch64-linux-android

      - name: Build Shared Library
        env:
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
        run: |
          cargo build --target aarch64-linux-android --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libgd_launcher_core
          path: target/aarch64-linux-android/release/*.so
